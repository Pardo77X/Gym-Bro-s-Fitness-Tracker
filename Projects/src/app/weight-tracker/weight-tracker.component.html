<div class="weight-box">
  <h3>Weight Tracker</h3>

  <label for="weight">Enter your weight (lbs):</label>
  <input
    id="weight"
    type="number"
    [(ngModel)]="weight"
    placeholder="e.g. 150"
  />

  <button (click)="saveWeight()">SAVE</button>

  <div class="history">
    <h4>Saved Weights:</h4>
    <ul>
      <li *ngFor="let w of weights">{{ w.dateRecorded | date:'short' }} - {{ w.weight }} lbs</li>
    </ul>
  </div>
</div>
